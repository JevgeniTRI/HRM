[project]
name = "hrm-backend"
version = "0.1.0"
description = "Personnel and skills management API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1.0",
  "starlette>=1.7,<2.0",
  "uvicorn>=0.34,<1.0",
  "sqlalchemy>=2.0.43,<2.1",
  "alembic>=1.16,<2.0",
  "pydantic-settings>=2.10,<3.0",
  "email-validator>=2.2,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "openpyxl>=3.1,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "httpx>=0.28,<1.0",
    "ruff>=0.12,<1.0",
    "httpx2>=2.13.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
